<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Monitoramento inteligente de cargas industriais.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="loadsecure">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>LoadSecure</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
const modelContext = document.modelContext;
if (modelContext?.registerTool) {
 const lifecycle = new AbortController();
 window.addEventListener('pagehide', () => lifecycle.abort(), {once:true});
 Promise.resolve(modelContext.registerTool({
 name:'navigate_loadsecure',title:'Abrir tela do LoadSecure',
 description:'Navega para uma tela do sistema após entrar na conta.',
 inputSchema:{type:'object',properties:{page:{type:'string',enum:['Dashboard','Cargas','Movimentações','Impactos','Inspeções','Checklists','Configurações','Notificações','Escanear','Mapas','Perfil']}},required:['page'],additionalProperties:false},
 annotations:{readOnlyHint:false,untrustedContentHint:false},
 async execute(input){
 const pages=['Dashboard','Cargas','Movimentações','Impactos','Inspeções','Checklists','Configurações','Notificações','Escanear','Mapas','Perfil'];
 if (!input || !pages.includes(input.page)) throw new Error('Tela inválida.');
 if (!window.loadSecureNavigate) throw new Error('Aplicativo ainda carregando.');
 if (!window.loadSecureNavigate(input.page)) throw new Error('Entre na conta antes de navegar.');
 await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
 return {requestedPage:input.page};
 }
 },{signal:lifecycle.signal})).catch(console.error);
}
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
